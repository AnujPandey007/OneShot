services:
  - type: web
    name: aatmagyan-tag-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: USE_DEMO_DATA
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
